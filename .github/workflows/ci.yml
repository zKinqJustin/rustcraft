name: Rustcraft CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-and-tools:
    name: Backend & Build System Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Test Backend
        run: |
          cd backend
          npm ci || npm install
          npm test

      - name: Test Launcher Core
        run: |
          cd launcher
          npm ci || npm install
          npm test

  website-build:
    name: Website Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Website
        run: |
          cd website
          npm ci || npm install
          npm run build
